name: plant_config
description: >
  Steam recovery loop demonstrating make-up water supplied by a water feedstock.
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600  # feedstock models require hourly time steps
    timezone: -6
# Left-to-right technology interconnections. Three-element entries connect the
# shared multivariable "steam" stream; the four-element water entry routes the
# make-up water feedstock through a pipe into the make-up intake.
technology_interconnections:
  - [hp_condensate_source, condensate_surge_tank_combiner, steam]
  - [lp_condensate_source, condensate_surge_tank_combiner, steam]
  - [condensate_surge_tank_combiner, makeup_water_intake, steam]
  - [makeup_water_intake, cst_pump, steam]
  - [cst_pump, deaerator, steam]
  - [deaerator, bfw_pump, steam]
  - [bfw_pump, boiler_feedwater_sink, steam]
  - [water_feedstock, makeup_water_intake, water, water_pipe]
tech_to_dispatch_connections: []
resource_to_tech_connections: []
